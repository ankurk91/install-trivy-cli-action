name: Install Trivy CLI
description: Installs the Trivy CLI on GitHub and Gitea Actions runners
author: ankurk91
branding:
  icon: download
  color: blue

inputs:
  version:
    description: The version to install, either "latest" or a tag such as "v0.70.0"
    required: false
    default: latest
  cache:
    description: Whether to cache the downloaded binary, ignored when version is "latest"
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Restore the binary from the cache
      if: ${{ inputs.cache == 'true' && inputs.version != 'latest' }}
      uses: actions/cache@v6
      id: trivy-cli-cache
      with:
        # actions/cache expands '~' but NOT environment variables like $HOME
        path: ~/.cache/trivy-cli
        key: ${{ runner.os }}-${{ runner.arch }}-trivy-cli-${{ inputs.version }}

    - name: Install Trivy CLI
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.version }}
        CACHE_HIT: ${{ steps.trivy-cli-cache.outputs.cache-hit == 'true' }}
        CACHE_ENABLED: ${{ inputs.cache == 'true' }}
      run: "$GITHUB_ACTION_PATH/scripts/install-trivy-cli.sh"
