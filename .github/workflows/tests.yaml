name: tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 16 * *'
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  with-default-options:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Execute this action
        uses: ./

      - name: Assert that trivy is on PATH and executable
        run: |
          test -x "$(command -v trivy)"

      - name: Assert that trivy reports a version
        run: |
          trivy --version
          trivy --version | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+'

      - name: Assert that the workspace was left clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  with-specific-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        cache: [ true, false ]

    env:
      EXPECTED_VERSION: v0.70.0

    steps:
      - uses: actions/checkout@v7

      - name: Execute this action
        uses: ./
        with:
          version: ${{ env.EXPECTED_VERSION }}
          cache: ${{ matrix.cache }}

      - name: Assert that the requested version was installed
        run: |
          trivy --version
          trivy --version | grep -Fq "${EXPECTED_VERSION#v}"

      - name: Assert that the binary is kept in the cache directory
        run: |
          test -x "$HOME/.cache/trivy-cli/trivy"

      - name: Assert that the workspace was left clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  with-invalid-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        version: [ '0.70.0', 'v0.70', 'nightly' ]

    steps:
      - uses: actions/checkout@v7

      - name: Execute this action
        id: install
        continue-on-error: true
        uses: ./
        with:
          version: ${{ matrix.version }}
          cache: false

      - name: Assert that the action rejected the version
        run: |
          test "${{ steps.install.outcome }}" = "failure"

      - name: Assert that nothing was downloaded
        run: |
          test ! -e "$HOME/.cache/trivy-cli/trivy"
