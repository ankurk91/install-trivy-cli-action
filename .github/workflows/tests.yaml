name: tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 16 * *'
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  with-default-options:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Execute this action
        uses: ./

      - run: trivy --version

      - name: Ensure the workspace was not polluted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  with-specific-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        cache: [ true, false ]

    steps:
      - uses: actions/checkout@v7

      - name: Execute this action
        uses: ./
        with:
          version: 'v0.70.0'
          cache: ${{ matrix.cache }}

      - run: trivy --version

      - name: Ensure the workspace was not polluted
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

